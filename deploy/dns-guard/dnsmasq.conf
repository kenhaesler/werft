# dns-guard (SPEC §1): resolves ONLY allowlisted names, forwards nothing else.
# NOT bind-interfaces: must answer on hot-attached per-run interfaces (M6).
port=53
no-resolv
no-hosts
domain-needed
bogus-priv
dns-forward-max=64
cache-size=1000
log-queries=extra
log-facility=/var/log/dnsguard/queries.log
# /etc/dnsmasq.d is bind-mounted read-only as a DIRECTORY from
# /opt/werft/config/dnsmasq.d (compose.yaml); dns-allow.conf is the one file in
# it, generated by gen-dns-allow.sh. Keep this path in step with that mount.
conf-file=/etc/dnsmasq.d/dns-allow.conf
# catch-all: everything not explicitly allowed is NXDOMAIN
address=/#/
